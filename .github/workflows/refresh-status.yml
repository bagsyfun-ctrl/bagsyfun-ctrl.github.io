name: refresh public status
on:
  schedule:
    - cron: "11 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bagsy-status-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_status.py
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- status.json; then exit 0; fi
          git config user.name "BAGSY status bot"
          git config user.email "status-bot@users.noreply.github.com"
          git add status.json
          git commit -m "Refresh public status snapshot"
          git push
